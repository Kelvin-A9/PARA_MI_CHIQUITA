<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una flor para ti 🌻</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #fff3a6, #ffd54f);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .contenedor {
            text-align: center;
        }

        /* BOTÓN PLAY */
        #play {
            background: #ffca28;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            transition: 0.3s;
        }

        #play:hover {
            transform: scale(1.1);
            background: #ffd740;
        }

        #play:active {
            transform: scale(0.95);
        }

        /* FLOR */
        .flor {
            display: none;
            position: relative;
            width: 220px;
            height: 350px;
            animation: aparecer 2s ease forwards;
        }

        .petalos {
            position: absolute;
            top: 20px;
            left: 10px;
            width: 200px;
            height: 200px;
            animation: girar 10s linear infinite;
        }

        .petalo {
            position: absolute;
            width: 80px;
            height: 110px;
            background: #ffd600;
            border-radius: 50% 50% 45% 45%;
            left: 60px;
            top: 10px;
            transform-origin: 40px 90px;
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.5);
        }

        .petalo:nth-child(1) {
            transform: rotate(0deg);
        }

        .petalo:nth-child(2) {
            transform: rotate(60deg);
        }

        .petalo:nth-child(3) {
            transform: rotate(120deg);
        }

        .petalo:nth-child(4) {
            transform: rotate(180deg);
        }

        .petalo:nth-child(5) {
            transform: rotate(240deg);
        }

        .petalo:nth-child(6) {
            transform: rotate(300deg);
        }

        .centro {
            position: absolute;
            width: 65px;
            height: 65px;
            background: #8d6e00;
            border-radius: 50%;
            top: 87px;
            left: 77px;
            z-index: 5;
            box-shadow: inset 0 0 0 10px #a88300;
        }

        /* TALLO */
        .tallo {
            position: absolute;
            width: 15px;
            height: 170px;
            background: #4caf50;
            left: 102px;
            top: 180px;
            border-radius: 10px;
        }

        /* HOJAS */
        .hoja {
            position: absolute;
            width: 75px;
            height: 35px;
            background: #43a047;
            border-radius: 100% 0 100% 0;
        }

        .hoja.izquierda {
            left: 40px;
            top: 240px;
            transform: rotate(25deg);
        }

        .hoja.derecha {
            right: 40px;
            top: 275px;
            transform: rotate(-25deg);
        }

        /* MENSAJE */
        .mensaje {
            margin-top: 15px;
            color: #5d4037;
            font-size: 25px;
            font-weight: bold;
            opacity: 0;
            animation: texto 2s ease 1s forwards;
        }

        @keyframes aparecer {
            from {
                transform: scale(0) translateY(100px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        @keyframes texto {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes girar {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .corazon {
            color: #e53935;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <!-- BOTÓN PLAY -->
        <button id="play">▶</button>

        <!-- FLOR -->
        <div class="flor" id="flor">

            <div class="petalos">
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="centro"></div>
            </div>

            <div class="tallo"></div>

            <div class="hoja izquierda"></div>
            <div class="hoja derecha"></div>

            <div class="mensaje">
                Para ti, mi Tornillito
                <span class="corazon">❤️</span>
            </div>

        </div>

    </div>

    <script>

        const boton = document.getElementById("play");
        const flor = document.getElementById("flor");

        boton.addEventListener("click", function() {

            boton.style.display = "none";

            flor.style.display = "block";

        });

    </script>

</body>
</html>
